<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Solid Explorer</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="importmap">
            {
                "imports": {
                    "@rdfjs/wrapper": "https://unpkg.com/@rdfjs/wrapper@0.34.0/dist/mod.js",
                    "@solid/reactive-authentication": "https://unpkg.com/@solid/reactive-authentication@0.2.0/dist/mod.js",
                    "@solid/reactive-authentication/registerElements": "https://unpkg.com/@solid/reactive-authentication@0.2.0/dist/registerElements.js",
                    "oauth4webapi": "https://cdn.jsdelivr.net/npm/oauth4webapi@3.8.6/+esm",
                    "dpop": "https://cdn.jsdelivr.net/npm/dpop@2.1.1/+esm",
                    "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.20.4?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common",
                    "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.11.1?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common",
                    "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.5?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@codemirror/lint,@lezer/common,@lezer/javascript",
                    "@codemirror/lang-json": "https://esm.sh/@codemirror/lang-json@6.0.2?external=@codemirror/language,@lezer/json",
                    "@codemirror/lang-xml": "https://esm.sh/@codemirror/lang-xml@6.1.0?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@lezer/common,@lezer/xml",
                    "@codemirror/language": "https://esm.sh/@codemirror/language@6.13.1?external=@codemirror/state,@codemirror/view,@lezer/common,@lezer/highlight,@lezer/lr",
                    "@codemirror/legacy-modes/mode/turtle": "https://esm.sh/@codemirror/legacy-modes@6.5.5/mode/turtle",
                    "@codemirror/lint": "https://esm.sh/@codemirror/lint@6.9.7?external=@codemirror/state,@codemirror/view",
                    "@codemirror/state": "https://esm.sh/@codemirror/state@6.7.6",
                    "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.15?external=@codemirror/state",
                    "@lezer/common": "https://esm.sh/@lezer/common@1.5.5",
                    "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.5?external=@lezer/common",
                    "@lezer/javascript": "https://esm.sh/@lezer/javascript@1.5.6?external=@lezer/common,@lezer/highlight,@lezer/lr",
                    "@lezer/json": "https://esm.sh/@lezer/json@1.0.3?external=@lezer/common,@lezer/highlight,@lezer/lr",
                    "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.12?external=@lezer/common",
                    "@lezer/xml": "https://esm.sh/@lezer/xml@1.0.6?external=@lezer/common,@lezer/highlight,@lezer/lr",
                    "n3": "https://cdn.jsdelivr.net/npm/n3@2.13.12/+esm",
                    "split-grid": "https://unpkg.com/split-grid@1.0.11/dist/split-grid.min.js"
                }
            }
        </script>
        <script type="module" src="./scripts/reactiveAuthenticationServiceWorker.js"></script>
        <script src="./scripts/index.js" type="module" defer></script>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: grid;
                grid:
                    "menu    menu     menu      menu     menu   " auto
                    "address address  address   address  address" auto
                    "crumb   crumb    crumb     crumb    crumb  " auto
                    "tree    divider1 container divider2 viewer " 1fr
                  /  1fr     20px     3fr       20px     3fr;
            }

            gutter-column {
                cursor: col-resize;
                background-color: lightsalmon;
                border-style: outset;
            }

            details details {
                padding-left: 10px
            }

            #addressBar form {
                flex-grow: 1;
                display: flex;
            }

            #addressBar form input {
                flex-grow: 1;
            }

            #tree {
                flex-grow: 1;
                width: 0;
                overflow: auto;
            }

            #container {
                flex-grow: 1;
                display: flex;
                gap: 1px 1px;
                flex-wrap: wrap;
                align-content: flex-start;
                width: 0;
                overflow: auto;
                padding: 1px;
            }

            #container div.selected {
                border: 3px double;
                padding: 8px;
            }

            #container div {
                padding: 10px;
                border: 1px solid;
            }

            #preview, #preview > div {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
            }

            #preview embed {
                flex-grow: 1;
            }

            #preview img, #preview video, #preview audio, #preview embed {
                width: 100%;
            }

            #preview .cm-editor {
                flex-grow: 1;
                min-height: 0;
            }

            ul[is=solid-crumb-trail] li {
                list-style-type: none;
                display: inline;
            }

            ul[is=solid-crumb-trail] li:after {
                margin: 0 10px;
                content: "/"
            }

            #resourceUriInput {
                font-family: monospace
            }

            menu {
                list-style-type: none;
                padding: unset;
                margin: unset;
            }

            dialog menu li button {
                width: 100%;
            }

            dialog div.buttons {
                text-align: right;
            }

            dialog button.ok {
                font-weight: bold;
            }

            dialog input:invalid {
                background-color: #FFEEEE;
            }

            dialog input:valid {
                background-color: #EEFFEE;
            }

            :target {
                background-color: lightgoldenrodyellow
            }
        </style>
        <link rel="icon" href="logo.svg">
    </head>
    <body is="solid-app">
        <div>
            <dialog id="confirmDialog" is="solid-ok-cancel-dialog" data-title="Sure?" data-ok-title="Yes" data-ok-value="yes" data-cancel-title="No"></dialog>
            <dialog id="uploadDialog" is="solid-upload-dialog" data-title="Upload"></dialog>
            <dialog id="newResourceDialog" is="solid-new-resource-dialog" data-title="New resource"></dialog>
            <dialog id="notFoundDialog" is="solid-ok-dialog" data-title="Not found"></dialog>
            <dialog id="newContainerDialog" is="solid-input-dialog" data-title="New container" data-label="Container name" data-required="true"></dialog>
            <authorization-code-flow></authorization-code-flow>
            <idp-picker>
                <option value="https://login.inrupt.com/"></option>
                <option value="https://openid.dev-next.inrupt.com/"></option>
                <option value="https://broker.inrupt.com/"></option>
                <webid-picker slot="webid-picker"></webid-picker>
            </idp-picker>
        </div>
        <menu style="grid-area: menu">
            <li>
                <button id="getSolidResourceUriFromWebIdButton">Get resource URI from WebID</button>
                <button id="fileMenu">file</button>
                <button id="helpButton">help</button>
            </li>
        </menu>
        <div id="addressBar" style="grid-area: address">
            <form is="solid-address-bar" tabindex="0">
                <label for="resourceUriInput">resource uri</label>
                <input id="resourceUriInput" required type="url" pattern="https?://.*">
                <button id="goButton" value="go">go</button>
                <button value="up">↑</button>
            </form>
        </div>
        <div style="grid-area: crumb">
            <ul is="solid-crumb-trail"></ul>
        </div>
        <div style="grid-area: tree; display: flex">
            <details id="tree" is="solid-tree" tabindex=""></details>
        </div>
        <gutter-column style="grid-area: divider1"></gutter-column>
        <div style="grid-area: container; display: flex">
            <div id="container" is="solid-container-view" tabindex="0"></div>
        </div>
        <gutter-column style="grid-area: divider2"></gutter-column>
        <div style="grid-area: viewer; display: flex">
            <div id="preview" is="solid-viewer"></div>
        </div>
        <script type="module">
            import "split-grid"

            Split({
                snapOffset: 0,
                minSize: 1,
                columnGutters: [{
                    track: 1,
                    element: document.querySelector("gutter-column:nth-of-type(1)"),
                }, {
                    track: 3,
                    element: document.querySelector("gutter-column:nth-of-type(2)"),
                }],
            })
        </script>
    </body>
</html>
